# Docker Compose configuration for Pharmacy Agent
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmacy-backend
    ports:
      - "3000:3000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5}
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:5173
      - DB_PATH=./src/database/pharmacy.db
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmacy-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: pharmacy-network